default: &default
  adapter: sqlite3
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: hanwen_corpus_viewer_development

test:
  <<: *default
  database: hanwen_corpus_viewer_test

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("PRIMARY_DATABASE_PATH") { Rails.root.join("storage", "hanwen_corpus_viewer_production.sqlite3") } %>
  queue:
    <<: *default
    database: <%= ENV.fetch("QUEUE_DATABASE_PATH") { Rails.root.join("storage", "hanwen_corpus_viewer_production_queue.sqlite3") } %>
    migrations_paths: db/queue_migrate
