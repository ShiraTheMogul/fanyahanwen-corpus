    kangxi:
      title: Kangxi radicals
      history_html: Kangxi Radicals (康熙部首) were first promulgated in 1615 by Mei Yingzuo 梅膺祚 in the dictionary <i>Zihui</i>
        字彙. They categorise characters by a visually prominent component, usually the semantic component that carries meaning.
      comparison: Kangxi radicals are not the same as Shuowen Jiezi's categories, which focus more broadly on shared graphical
        elements rather than a consistent set of strokes forming a semantically or phonetically meaningful component.
      page_title: Radical %{number} %{radical}
      heading: 'Radical %{number}:'
      membership_empty_html: <strong>Radical membership index is empty.</strong> Run %{command} to build it from Unihan %{field}.
      about: About this radical
      back: Back to radicals index
      browse_intro_html: Browse characters by Kangxi radical using Unihan %{field}.
    shuowen:
      title: Shuowen components
      heading_html: '%{link} components 說文解字部首'
      intro_html: 'Browse characters by Shuowen Jiezi components. Xu Shen 許慎 designed these 540 categories in the second century
        during the Eastern Han 東漢 for his dictionary <i>Shuowen Jiezi</i> 說文解字, a landmark work of lexicography. %{text_link}
        analyses characters chiefly through their structure and relates this analysis to <i>Zhengming</i> 正名, the “Rectification
        of Names”. The work is therefore sociopolitical as well as lexicographical. Xu states in its preface:'
      preface_translation_html: '<i>“Written language is the foundation of the classics and arts, and the beginning of kingly
        government. Through it former people passed things down to later people, and later people recognise antiquity. Therefore
        it is said: ‘When the root is established, the Way grows.’ Thus one may know the utmost intricacies under Heaven without
        allowing them to fall into disorder.”</i>'
      historical_caution_html: 'This is a deeply Confucian and inherently prescriptive idea rooted in <i>Zhengming</i>. Xu
        could nevertheless be mistaken: the work is nearly two thousand years old, and modern palaeographic evidence—especially
        oracle-bone script 甲骨文—was unavailable to him.'
      comparison: Shuowen components are not the same as Kangxi radicals. They are broad categories based on visual similarity
        and may be phonetic, semantic, or even a single stroke. This is why this site calls them components.
      text_itself: The text itself
      shuowen_jiezi: Shuowen Jiezi
      page_title: Shuowen component %{number} %{glyph}
      heading: 'Shuowen component %{number}:'
      about: About this component
      back: Back to Shuowen index
