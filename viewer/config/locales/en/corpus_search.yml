en:
  corpus_search:
    title: Corpus Search
    introduction: Search corpus body text directly. Metadata headers never produce hits or counts.
    form:
      mode: Search mode
      search_text: Search text
      find_all_terms: Find all terms within one passage
      find_any_term: Find any of these terms
      alternatives_hint: Terms are joined with OR. A result is returned when any entered term occurs.
      maximum_span: Maximum span
      order: Order
      ignore_punctuation: Ignore punctuation and spacing
      body_only_rule: Metadata headers are never searched.
      character_matching: Character matching
      additional_filters: Scope and additional filters
      include_folders: Included folders
      exclude_folders: Excluded folders
      folder_hint: Tick one or more folders to limit the search. Leave every folder unticked to search all folders in the selected text layers. A selected folder always includes its descendants.
      search_within_folder: Search within
      exclude_folder: Exclude
      exclude_named_folder: 'Exclude %{folder}'
      folder_document_count: '%{count} file(s)'
      context_characters: Context characters
      results_per_page: Results per page
      nation: Nation
      period: Period
      region: Region
      author: Author
      year_from: Year from
      year_to: Year to
      text_witnesses: Texts and corpus layers
      text_witnesses_hint: Received texts are searched by default. Other layers are included only when selected here.
      term_limit: Add between 2 and %{max} terms.
      folder_scope: Folder scope
    modes:
      exact: Exact sequence
      proximity: Proximity
      alternatives: Alternatives (OR)
    orders:
      any: Any order
      entered: Entered order
    punctuation:
      ignore: Ignored for matching
      respect: Matched exactly
    characters:
      exact: Exact forms only
      common: Common variants
      broad: Broad script equivalents
    character_hints:
      exact: Only the entered character forms match.
      common: Also match reviewed character variants from the Taiwan Ministry of Education registry.
      broad: Also match controlled simplified, traditional, and Japanese shinjitai correspondences from OpenCC.
    equivalence_sources:
      taiwan_moe: Taiwan Ministry of Education variant mapping
      zetian_script: Zetian-script mapping
