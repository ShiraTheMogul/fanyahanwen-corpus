    analysis:
      title: Corpus Search Analysis
      workspace: Search workspace
      tabs:
        results: Results
        analysis: Analysis
        query_details: Query details
        comparison: Compare scopes
        advanced: Advanced analysis
      overview: Analysis overview
      body_only_note: Rates are calculated from the text itself; metadata is excluded.
      runtime: Time
      measure: Measure shown in grouped figures
      groups_omitted: '%{count} additional groups remain in the downloadable CSV table.'
      matches_per_document: Matches per document
      matches_per_document_note: This shows whether the result is spread across the corpus or concentrated in a smaller set of documents.
      proximity_spans: Proximity spans
      proximity_note: The span is the number of searchable characters from the first matched term to the end of the last matched term.
      top_documents: Documents contributing the most occurrences
      concentration: Result concentration
      concentration_summary: 'Top document: %{top1}. Top five: %{top5}. Top ten: %{top10}.'
      warnings: Analysis notes and warnings
      reproducibility: Reproducibility files
      reproducibility_note: The ZIP includes the data, analysis code, tables, figures, warnings, and timing information needed to reproduce the analysis.
      reproducibility_note_phase8: The saved bundle includes the data, analysis code, tables, figures, method and citation text, a corpus snapshot identifier, checksums, warnings, and timing information needed to reproduce the analysis.
      reproducibility_note_phase9: The saved bundle includes the data, analysis code, grouped and advanced analysis tables, figures, sensitivity data, method and citation text, a corpus snapshot identifier, checksums, warnings, and timing information needed to reproduce the analysis.
      snapshot_id: Corpus snapshot
      record_id: Saved result
      completed_at: Completed
      artifact_count: Files
      methods_summary: Citation-ready methods summary
      suggested_citation: Suggested citation
      unavailable: Analysis is unavailable
      unavailable_note: The search completed, but the analysis could not be created. Search results are still available in the ZIP.
      metrics:
        occurrences: Occurrences
        matching_documents: Matching documents
        documents: Documents in scope
        searchable_characters: Searchable body characters
        document_prevalence: Documents containing the query
        occurrences_per_million: Occurrences per million characters
      dimensions:
        period: Period
        nation: Nation
        region: Region
        author: Author
        folder: Folder branch
        document_role: Text or corpus layer
      advanced:
        heading: Advanced corpus analysis
        introduction: These analyses use occurrences in the text, nearby text characters, document size, and recorded dates. Metadata fields are excluded.
        neighbours: Neighbouring characters
        neighbours_note: Counts characters found within five text characters to the left or right of each matched passage. Punctuation, spacing, and control characters are excluded.
        character_forms: Forms actually matched
        character_forms_note: Compares each entered term with the form actually present in the source. This makes common-variant and broad-equivalence searches auditable without converting the corpus text.
        neighbour_keyness: Distinctive neighbouring characters between scopes
        neighbour_keyness_note: For a two-scope comparison, this compares characters found near the matches. G² ranks how strongly the two groups differ; the log₂ ratio shows the direction and size of the difference. This describes the selected match context, not the whole corpus.
        alternatives: Alternative-term contributions
        alternatives_note: Shows which OR alternatives produced the results. One source occurrence may count for more than one alternative when their accepted character forms overlap.
        term_orders: Observed proximity orders
        term_orders_note: Groups proximity matches by the order in which the entered terms actually occur in the source passage.
        time: Frequency through dated centuries
        time_note: Documents with parseable dates are grouped into historical centuries. Points show occurrences per million searchable body characters; bars are approximate 95% Poisson intervals. Undated documents remain in the overall totals but not this chart.
        model: Exploratory count model
        rate_ratio_century: Rate ratio per century
        rate_ratio_interval: Approximate 95% interval
        p_value: Trend p-value
        overdispersion: Poisson overdispersion ratio
        time_model_warning: This is a descriptive document-level model with searchable body characters as exposure. It does not establish a causal historical trend.
        dispersion: Dispersion across documents
        dispersion_note: Deviation of Proportions compares each document's share of occurrences with its share of searchable corpus size. DPnorm near 0 means the query follows corpus exposure relatively evenly; values near 1 mean strong concentration.
        evenness: Evenness (1 − DPnorm)
        document_range: Document range
        duplicates: Exact-text duplication audit
        duplicates_note: Default statistics retain every stored document. The sensitivity check also treats documents with exactly identical body text as one unit. This detects exact copies only, not near-duplicate editions or quotations.
        show_duplicate_groups: Show the largest exact-body groups
        bases:
          documents_as_stored: Documents as stored
          unique_exact_bodies: Unique exact body texts
      table:
        document: Document
        layer: Layer
        occurrences: Occurrences
        share: Share of all hits
        per_million: Per million
        character: Character
        left: Left
        right: Right
        total: Total
        basis: Counting basis
        example: Example
        favoured_scope: Favoured scope
        log_ratio: Log₂ ratio
    comparison:
      heading: Compare two scopes
      introduction: Compare the same query across two groups in this saved analysis. The comparison uses the saved results, so the corpus does not need to be searched again.
      dimension_note: Compared by %{dimension}.
      dimension: Compare by
      left_scope: Scope A
      right_scope: Scope B
      choose_group: Choose a group
      prepare: Prepare comparison
      not_enough_groups: This analysis does not contain two groups in any supported comparison dimension.
      effect_sizes: Comparison statistics and effect sizes
      statistics_note: The A/B rate ratio uses searchable body characters as exposure. The likelihood statistic tests whether the two occurrence rates differ; it does not establish historical causation.
      table:
        scope: Scope
      effects:
        rate_ratio_left_over_right: Rate ratio (A / B)
        rate_ratio_ci_low_95: Rate-ratio 95% interval, lower
        rate_ratio_ci_high_95: Rate-ratio 95% interval, upper
        log2_rate_ratio: Log2 rate ratio
        rate_difference_per_million: Rate difference per million characters
        document_prevalence_difference_percentage_points: Document-prevalence difference
        document_prevalence_ratio: Document-prevalence ratio
        poisson_log_likelihood_g2: Poisson log-likelihood G²
        poisson_log_likelihood_p_value: Poisson log-likelihood p-value
      errors:
        dimension: Choose a supported comparison dimension.
        left_group: Choose Scope A.
        right_group: Choose Scope B.
        distinct: Scope A and Scope B must be different.
        source_incomplete: The saved source analysis must be complete before it can be compared.
        analysis_unavailable: The source analysis does not contain a readable analysis report.
        group_missing: '%{group} is not present in the selected comparison dimension.'
    statuses:
      queued: Waiting
      running: Running
      complete: Complete
      failed: Failed
      cancel_requested: Cancelling
      cancelled: Cancelled
    stages:
