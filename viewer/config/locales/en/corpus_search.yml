        blank_years: Blank year_start/year_end cells mean that the corpus metadata did not contain parseable year data.
        offsets: Offsets are character offsets into the body text after metadata and separator lines are removed.
        equivalence: Non-literal matches retain the entered character, source character, mapping path, and mapping source.
        canonical_source: The source .txt files remain the authoritative corpus; this export is derived search output.
        analysis_dataset: document_counts.csv contains body-only document counts and searchable-character denominators used by the included Ruby script.
    roles:
      canonical: Received text
      textual_variant: Variants
      raw: Raw source material
      derived_reading: Kanbun / Hanmun / Hanvan
      translation: Translation
      annotation: Annotation
