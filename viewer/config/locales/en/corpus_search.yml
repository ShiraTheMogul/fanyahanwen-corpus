    placeholders:
      sequence: 關關雎鳩在河之洲
      term: Term %{number}
      nation: 日本 / 越南 / 中國...
      period: 江戶時代 / 大越...
    actions:
      search: Search
      prepare_export: Prepare full ZIP export in background
      prepare_analysis: Prepare R analysis
      open_source_text: Open source text at this match
      download_zip: Download ZIP
      copy_live_url: Copy live query URL
      copy_frozen_url: Copy frozen result URL
      open_live_query: Open live query
      copied: Copied
      add_term: Add another term
      remove: Remove
      remove_term: Remove term %{number}
      toggle_folder: Expand or collapse %{folder}
      open_received_text_folder: Open received-text folder
    results:
      summary: 'Showing %{visible} result(s) on this page. Cached/checked candidate files: %{candidates}. Files newly scanned for this request: %{scanned}.'
      truncated: This interactive search stopped at %{limit} hits. Prepare a background export for the complete result set.
      complete_count: 'Complete interactive result count: %{count}.'
      offset: body offset %{start}–%{finish}
      none: No results found.
      matched_alternatives: 'Matched alternative(s): %{terms}'
      equivalent_forms_used: '%{count} equivalent-form match(es) explained'
      equivalence_via: 'via %{sources}; mapping path %{path}'
      chars_omitted:
        one: '%{count} character omitted'
        other: '%{count} characters omitted'
    query_details:
      heading: Query details
      mode: Mode
      query: Query
      punctuation: Punctuation
      character_matching: Character matching
      equivalence_registry: Character-equivalence registry version
      text_witnesses: Texts and corpus layers
      folders: Folder scope
      metadata: Metadata headers
      profile: Normalization profile version
      live_url: Live query URL
      never_searched: Never searched or counted
      all_selected_folders: All folders in the selected corpus layers
      excluded_folders: Excluded folders
    pagination:
      aria_label: Search result pages
      previous: Previous
      next: Next
      page_of: Page %{page} of %{pages}
    prepared:
      title: Prepared Corpus Search
      status: Status
      query: Query
      progress: 'Stage: %{stage}. Files: %{scanned} / %{total}. Hits found: %{hits}.'
      zip_contents: The ZIP contains concordance results, body-only analysis data, grouped CSV tables, the exact R script, SVG and PNG figures, and runtime provenance.
      refresh_notice: This page will refresh every %{seconds} seconds while the job is running.
    analysis:
      title: Corpus Search Analysis
      workspace: Search workspace
      tabs:
        results: Results
        analysis: Analysis
        query_details: Query details
        comparison: Compare scopes
        advanced: Advanced analysis
      overview: Analysis overview
      body_only_note: All rates use searchable body characters. Metadata headers never contribute to matches or denominators.
      r_runtime: R analysis
      measure: Measure shown in grouped figures
      groups_omitted: '%{count} additional groups remain in the downloadable CSV table.'
      matches_per_document: Matches per document
      matches_per_document_note: This shows whether the result is spread across the corpus or concentrated in a smaller set of documents.
      proximity_spans: Proximity spans
      proximity_note: The span is the number of searchable characters from the first matched term to the end of the last matched term.
      top_documents: Documents contributing the most occurrences
      concentration: Result concentration
      concentration_summary: 'Top document: %{top1}. Top five: %{top5}. Top ten: %{top10}.'
      warnings: Analysis notes and warnings
      reproducibility: Reproducibility files
      reproducibility_note: The ZIP includes the exact R script, body-only input tables, every grouped CSV, SVG and PNG figures, warnings, timing, and sessionInfo().
      reproducibility_note_phase8: The frozen bundle includes the exact R script, body-only input tables, aggregate CSV files, figures, method text, citation text, a corpus snapshot identifier, SHA-256 checksums, warnings, timing, and sessionInfo().
      reproducibility_note_phase9: The frozen bundle includes the exact R script, body-only input tables, grouped and advanced analysis tables, figures, exact-body sensitivity data, method text, citation text, a corpus snapshot identifier, SHA-256 checksums, warnings, timing, and sessionInfo().
      snapshot_id: Corpus snapshot
      record_id: Prepared record
      completed_at: Completed
      artifact_count: Verified artifacts
      methods_summary: Citation-ready methods summary
      suggested_citation: Suggested citation
      unavailable: R analysis is unavailable
      unavailable_note: The search export completed, but no analysis report was produced. The ZIP still contains the input data, exact R script, warnings, and runtime metadata so the analysis can be run elsewhere.
      metrics:
        occurrences: Occurrences
        matching_documents: Matching documents
        documents: Documents in scope
        searchable_characters: Searchable body characters
        document_prevalence: Documents containing the query
        occurrences_per_million: Occurrences per million characters
      dimensions:
        period: Period
        nation: Nation
        region: Region
        author: Author
        folder: Folder branch
        document_role: Text or corpus layer
      advanced:
        heading: Advanced corpus analysis
        introduction: These analyses use only body-text occurrences, nearby body characters, document exposure, and recorded dates. They do not search metadata headers.
        neighbours: Neighbouring characters
        neighbours_note: Counts characters found within five body-text characters to the left or right of each matched passage. Punctuation, spacing, and control characters are excluded.
        character_forms: Forms actually matched
        character_forms_note: Compares each entered term with the form actually present in the source. This makes common-variant and broad-equivalence searches auditable without converting the corpus text.
        neighbour_keyness: Distinctive neighbouring characters between scopes
        neighbour_keyness_note: For a two-scope comparison, this contrasts characters in the five-character windows around the matches. G² ranks contextual differences; the log-ratio shows which selected scope favours the character. It is not general corpus-wide keyness.
        alternatives: Alternative-term contributions
        alternatives_note: Shows which OR alternatives produced the results. One source occurrence may count for more than one alternative when their accepted character forms overlap.
        term_orders: Observed proximity orders
        term_orders_note: Groups proximity matches by the order in which the entered terms actually occur in the source passage.
        time: Frequency through dated centuries
        time_note: Documents with parseable dates are grouped into historical centuries. Points show occurrences per million searchable body characters; bars are approximate 95% Poisson intervals. Undated documents remain in the overall totals but not this chart.
        model: Exploratory count model
        rate_ratio_century: Rate ratio per century
        rate_ratio_interval: Approximate 95% interval
        p_value: Trend p-value
        overdispersion: Poisson overdispersion ratio
        time_model_warning: This is a descriptive document-level model with searchable body characters as exposure. It does not establish a causal historical trend.
        dispersion: Dispersion across documents
        dispersion_note: Deviation of Proportions compares each document's share of occurrences with its share of searchable corpus size. DPnorm near 0 means the query follows corpus exposure relatively evenly; values near 1 mean strong concentration.
        evenness: Evenness (1 − DPnorm)
        document_range: Document range
        duplicates: Exact-text duplication audit
        duplicates_note: Default statistics retain every stored document. The sensitivity check also treats documents with exactly identical body text as one unit. This detects exact copies only, not near-duplicate editions or quotations.
        show_duplicate_groups: Show the largest exact-body groups
        bases:
          documents_as_stored: Documents as stored
          unique_exact_bodies: Unique exact body texts
      table:
        document: Document
        layer: Layer
        occurrences: Occurrences
        share: Share of all hits
        per_million: Per million
        character: Character
        left: Left
        right: Right
        total: Total
        basis: Counting basis
        example: Example
        favoured_scope: Favoured scope
        log_ratio: Log₂ ratio
    comparison:
      heading: Compare two scopes
      introduction: Apply the same text query to two groups already present in this frozen analysis. The comparison reuses its body-only dataset and runs a new, reproducible R analysis without rescanning the corpus.
      dimension_note: Compared by %{dimension}.
      dimension: Compare by
      left_scope: Scope A
      right_scope: Scope B
      choose_group: Choose a group
      prepare: Prepare comparison
      not_enough_groups: This analysis does not contain two groups in any supported comparison dimension.
      effect_sizes: Comparison statistics and effect sizes
      statistics_note: The left/right rate ratio uses searchable body characters as exposure. The likelihood statistic tests equality of the two occurrence rates; it does not establish historical causation.
      table:
        scope: Scope
      effects:
        rate_ratio_left_over_right: Rate ratio (A / B)
        rate_ratio_ci_low_95: Rate-ratio 95% interval, lower
        rate_ratio_ci_high_95: Rate-ratio 95% interval, upper
        log2_rate_ratio: Log2 rate ratio
        rate_difference_per_million: Rate difference per million characters
        document_prevalence_difference_percentage_points: Document-prevalence difference
        document_prevalence_ratio: Document-prevalence ratio
        poisson_log_likelihood_g2: Poisson log-likelihood G²
        poisson_log_likelihood_p_value: Poisson log-likelihood p-value
      errors:
        dimension: Choose a supported comparison dimension.
        left_group: Choose Scope A.
        right_group: Choose Scope B.
        distinct: Scope A and Scope B must be different.
        source_incomplete: The source analysis must be complete and frozen before it can be compared.
        analysis_unavailable: The source analysis does not contain a readable R report.
        group_missing: '%{group} is not present in the selected comparison dimension.'
    statuses:
      queued: Queued
      running: Running
      complete: Complete
      failed: Failed
    stages:
      queued: Queued
      searching: Searching
      copying_source_dataset: Copying frozen analysis dataset
      building_analysis_dataset: Building analysis dataset
      running_r: Running R analysis
      complete: Complete
      failed: Failed
    notices:
      queued: The large search has been queued. You can keep using the site while it runs.
    errors:
      enter_sequence: Enter an exact sequence to search for.
      enter_two_terms: Enter at least two terms for a proximity search.
      enter_two_alternatives: Enter at least two alternatives for an OR search.
      term_too_long: Search terms cannot be longer than %{max} characters.
      search_failed: 'Search failed: %{message}'
      prepared_not_found: Prepared search not found
      download_not_ready: Download is not ready yet
      too_many_terms: A proximity search can contain at most %{max} terms.
      too_many_alternatives: 'An OR search can contain at most %{max} alternatives.'
      folder_tree_unavailable: The folder list is not ready yet. Searches still cover every folder in the selected text layers.
    query:
      proximity_label: '%{terms} within %{distance} searchable characters'
      alternatives_label: '%{terms}'
    export:
      flashcards:
        front: 'Translate or explain %{target} in context:

          %{snippet}'
        back: 'Target: %{target}

          Source: %{source}'
      metadata_notes:
        blank_years: Blank year_start/year_end cells mean that the corpus metadata did not contain parseable year data.
        offsets: Offsets are character offsets into the body text after metadata and separator lines are removed.
        equivalence: Non-literal matches retain the entered character, source character, mapping path, and mapping source.
        canonical_source: The source .txt files remain the authoritative corpus; this export is derived search output.
        analysis_dataset: document_counts.csv contains body-only document counts and searchable-character denominators used by the included R script.
    roles:
      canonical: Received text
      textual_variant: Variants
      raw: Raw scrapes
      derived_reading: Kanbun / Hanmun / Hanvan
      translation: Translation
      annotation: Annotation
