      enter_two_terms: Enter at least two terms for a proximity search.
      enter_two_alternatives: Enter at least two alternatives for an OR search.
      term_too_long: Search terms cannot be longer than %{max} characters.
      search_failed: Something went wrong while searching. Please try again. If the problem continues, let the site maintainer know.
      prepared_not_found: Saved search not found
      download_not_ready: Download is not ready yet
      full_search_active: You already have a full search running or waiting. Please wait for it to finish, download it, cancel it, or let it expire.
      full_search_busy: Full search is currently busy. Please try again later.
      too_many_terms: A proximity search can contain at most %{max} terms.
