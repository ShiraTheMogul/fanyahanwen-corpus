      snippets:
        heading: Insert a template
        explanation: Corpus quotations are inserted at the cursor. Preset searches are added to the YAML front matter automatically.
        quote_button: Add corpus quotation
        exact_button: Add one-term search
        alternatives_button: Add OR search
        proximity_button: Add proximity search
        guide_heading: What the fields do
        quote_comment: path opens the corpus source; text is the quotation; highlight marks matching text yellow; source is the displayed source name.
        exact_comment: exact searches for one uninterrupted string; term_a is the text to find.
        alternatives_comment: alternatives searches for any listed spelling or name.
        proximity_comment: proximity finds term_a and term_b near one another; distance is their maximum separation.
        path_placeholder: Place the corpus file path here
        text_placeholder: Place the quoted text here
        highlight_placeholder: Place the text to highlight yellow here
        source_placeholder: Place the displayed source title here
        second_term_placeholder: Place another name or search term here
        path_help: The corpus file path. It makes the source caption open the quoted text in the corpus viewer.
        text_help: The passage shown to the reader.
        highlight_help: Text within the passage that should be marked yellow. Separate alternatives with a vertical bar (|).
        source_help: The readable source title shown beneath the quotation.
        terms_help: A list used by an alternatives search. A result may contain any one of the listed names.
        polity_help: An optional metadata filter. It restricts results to documents assigned to one polity; this is useful for common characters but changes the historical question being asked.
        distance_help: The greatest permitted distance between proximity terms, measured in characters.
