    help:
      slot: >-
        A bare syllable returns every tone; add a tone number or mark to bind
        one. yi returns all of them, yi1 and yī only the first.
      umlaut: >-
        v is accepted for ü, as keyboards input it: lv gives lü, nv gives nü.
      secondary: >-
        Restricts the set to characters that also carry this syllable in a
        second system. This is what makes cross-topolect homophony tractable.
      secondary_blank: >-
        Type a syllable to narrow the results to characters that also read that
        way here. Leave it empty and this system just adds its column, so you
        can see every result's reading in it without filtering anything. Leave
        it empty while giving a character above and the search reads that
        character's own syllable here instead — which is how you compare 是
        across Beijing and Shanghai without having to know that this source
        writes the Shanghai onset zɦ rather than z.
      rime_books: >-
        Filters against one of the corpus's own parsed books, using that
        book's categories. A tone or a rhyme category is a claim its compiler
        made, so it only means anything inside the book that made it: 廣韻,
        集韻, 五音集韻, 切韻 and 洪武正韻 each file 上聲 differently, and 麻 heads
        a section in six of them naming a different rime in each. Choose the
        book and the boxes below fill with its own vocabulary.
      rime_book_from_source: >-
        The source chosen above is a rime book, so these are its own
        categories.
      rime_book_required: >-
        Choose a book and its own tones and categories appear here.
      graphic_form: >-
        Narrows by written form rather than by sound. The radical is the Kangxi
        number, 1 to 214.
      homophone: >-
        Give a character and the search returns everything sharing its
        readings in the chosen system. Tick "match tone too" to require the
        tone to agree as well as the syllable.
      ids: >-
        Choose a layout, then fill the slots you care about and leave the rest
        as ?. ⿰木? finds characters built left-to-right with 木 on the left;
        ⿰?木 finds 木 on the right. A slot left open matches whatever sits
        there, however complicated.
      component: >-
        Any component anywhere in the character, at any depth, regardless of
        how it is arranged. Use the structure builder below to say where.
      per_page: >-
        How many characters one screen shows. It is not a limit on the search:
        the count above is always the true total, and the CSV always holds
        every match.
      group_variants: >-
        Folds variant spellings of one character into a single row; every
        member keeps its own readings and quotations, listed as rows beneath
        the head. "By script" is OpenCC, which joins 当 to 當 and nothing
        looser. "By variant" is the Taiwan Ministry of Education 異體字字典,
        which is broader and editorial — it joins 蕩 to 蘯 and 簜, and also
        records 壹 as a variant of 一. "By both" takes the closure of the two.
      inventory: >-
        Every syllable a reading system is attested to have, with the number of
        characters in each. An inventory belongs to a system rather than to the
        language as a whole: Cantonese holds syllables Mandarin does not,
        Guǎngyùn 廣韻 is organised by xiǎoyùn 小韻 small rimes rather than by
        syllable, and Japanese on'yomi 音讀 carries no tone to remove.
