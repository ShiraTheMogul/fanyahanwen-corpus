    rime_book_hints:
      廣韻: "Compiled 1008, Song, but evidence for the earlier system — the Tang and Song revisions “did not, on the whole, disturb Lu Fayan's phonological categories” (Pulleyblank 1984). 平聲 is bound in two fascicles, 上平聲 and 下平聲."
      切韻: "601, Sui. The Early Middle Chinese standard itself. Lost; the corpus holds two modern reconstructions of it, which differ from each other."
      集韻: "Compiled 1039, Song. A much larger revision in the 切韻 line; 176 rhyme categories against 廣韻's 199."
      五音集韻: "1212, Jin. Rearranges 集韻 under the 36 initials, but also merges — 160 rhyme categories — so it records a later system rather than a reshelved earlier one."
      洪武正韻: "1375, Ming. A prescriptive standard with 76 rhyme categories; it restored the 入聲 that 中原音韻 had already lost fifty years earlier."
      玉篇: "A 字書 arranged by 部首, not a rime book; it records 反切 but no tone sections. Edition matters here — this is the 1013 大廣益會玉篇 recension, whereas Pulleyblank draws on the Liang original “as opposed to the revised edition of the Song period”."
    errors:
      missing_slot: Choose a reading system and enter a syllable.
      missing_criteria: >-
        Enter something to search for: a syllable, a character to find
        homophones of, a component, or an IDS sequence.
      character_not_found: >-
        %{value} is not in the character database.
      no_readings_for_character: >-
        %{value} has no recorded reading in that system, so it has no
        homophones to find there.
      unknown_system: That reading system is not available. Choose another.
      unparsable_slot: "%{spec} is not a syllable this system recognises."
      no_reading_in_system: >-
        %{value} has no recorded reading in %{system}, so there is nothing to
        compare there.
      slot_not_in_system: >-
        %{system} has no syllable %{value}.
      did_you_mean: "Closest in its inventory: %{list}."
      no_inventory_for_rime_book: >-
        A rime book has no syllable inventory. It spells with 反切, and every
        romanisation of that spelling — Baxter & Sagart, Pulleyblank, Karlgren
        — is that scholar's reading of it, not the book's own. Use the book's
        tones, rhyme categories and 反切 instead.
      rime_book_conflict: >-
        Two different books were named: %{system} as the source, and another
        in the rime-book filters. The source won, and the filters were applied
        to it. Clear one of them.
      rime_book_not_chosen: >-
        Choose which book the rime-book filters apply to. 廣韻, 集韻, 五音集韻,
        切韻 and 洪武正韻 each assign these categories themselves, so a filter
        with no book behind it would return a set none of them asserted.
      unexpected: >-
        Something went wrong running that query. Nothing was changed. Try
        again, or narrow the constraints.
