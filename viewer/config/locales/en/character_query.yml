en:
  character_query:
    title: Character constraint query
    description: >-
      Find every character attested for a given syllable, narrow the set with
      further constraints, and draw meanings from whichever historical
      dictionaries you choose. The syllable carries its own tonal precision:
      "yi" returns every tone, while "yi1" or "yī" returns only the first.
    slot_inventory_title: Syllable inventory
    slot_inventory_description: >-
      Every syllable a reading system is attested to have, with the number of
      characters in each. An inventory belongs to a system rather than to the
      language as a whole: Cantonese holds syllables Mandarin does not,
      Guǎngyùn 廣韻 is organised by xiǎoyùn 小韻 small rimes rather than by
      syllable, and Japanese on'yomi 音讀 carries no tone to remove.
    families:
      sino_tibetan: Sino-Tibetan
      japonic: Japonic
      koreanic: Koreanic
      austroasiatic: Austroasiatic
      kra_dai: Kra-Dai
