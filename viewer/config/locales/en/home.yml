    hero:
      daily_reading_aria: Today's Shijing reading
      summary: Welcome to Fanya Hanwen Corpus 泛亞漢文語料庫, a Literary Chinese corpus containing over twice as much text as Siku Quanshu. It brings together texts from across Asia and across history, with tools for reading, searching, and study.
    introduction:
      heading: 序 Introduction
      body: Fanya Hanwen Corpus brings together Literary Chinese texts from the Chinese dynasties, the Korean peninsula, Japan, Vietnam, the Ryukyu Kingdom, Singapore, and many historical states and regions. Literary Chinese has been used across different places, periods, and communities, producing a wide range of texts. The project has three aims—to represent that regional and cultural variety, to support modern teaching and learning, and to make the corpus, its evidence, and its research tools easy to use.
    corpus_viewer:
      heading: 語庫讀器
      link: Corpus Viewer
      introduction: The Corpus Viewer provides tools for reading and studying Literary Chinese texts in the corpus.
      includes: 'This includes:'
      features:
        pronunciation: Pronunciation annotations for many Asian languages and varieties, including Mandarin, Japanese, Korean, Vietnamese, Zhuang, Old National Pronunciation, Middle Chinese, Old Chinese, and Okinawan. Choose a reading system that suits what you are studying.
        punctuation: Options for punctuation (judou 句讀) or to remove it.
        underlining: Traditional underlining systems in their original colours or colour-blind adjusted versions.
        annotation_systems: Kanbun, hanmun, and hanvan annotations.
        fonts: Different fonts, including one for seal script.
        orientation: Vertical or horizontal text with layouts adapted to each direction.
        character_forms: Conversion between different character traditions, including Simplified Chinese and discontinued simplification standards.
        dictionary: A dictionary combining Unihan data with additional sources and corpus research.
        translations: Read and submit translations.
    dictionary:
      heading: 字典 Dictionary
      overview: The dictionary brings together definitions, readings, pronunciation data, character variants, and character-form conversion. It combines established dictionary and Unicode sources with additional variant research used by the corpus.
      sources: Dictionary definitions and popups draw on CC-CEDICT, Unihan, and Kangxi Dictionary. Kangxi Dictionary entries are reformatted with line breaks for easier reading. Guangyun and Shuowen Jiezi can also be browsed on the site, with their ordering explained on the relevant pages.
      planned_intro: 'More historical dictionaries are planned for comparison, including dictionaries cited in Siku Quanshu:'
      wider_scope: Dictionaries from outside China are also planned. The aim is to support both Literary Chinese learning and research across the wider written tradition.
    submission:
      heading: Text Submission
      introduction: Choose the corpus collection this text belongs in.
      open_button: Submit a text
      path_hint_html: Choose the corpus collection that best fits the text, such as %{first_path} or %{second_path}.
      parent_path_placeholder: e.g. 越南漢文/clean
    future_plans:
      heading: 來想 Future Plans
      body: Planned additions include a nation atlas, a grammar wiki, more detailed treatment of variants and corrected texts, and synopses and summaries for more works.
