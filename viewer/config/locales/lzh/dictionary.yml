    kangxi:
      title: 康熙部首
      history_html: 康熙部首之制，梅膺祚始定於萬曆四十三年（1615）所撰《字彙》。其依字形中顯著之部件分類諸字，通常取承載字義之義符。
      comparison: 康熙部首與《說文解字》部首不同；後者較廣，凡共見之形體皆可分類，不必為一組固定筆畫，亦不必具表義或表音之功。
      page_title: 第%{number}部 %{radical}
      heading: '第%{number}部：'
      membership_empty_html: '<strong>部首歸屬索引尚空。</strong>請執行%{command}，依Unihan %{field}建立之。'
      about: 此部首
      back: 返部首索引
      browse_intro_html: 依Unihan %{field}所記康熙部首尋字。
    shuowen:
      title: 《說文解字》部首
      heading_html: '%{link}部首'
      intro_html: 依《說文解字》部首尋字。許慎於東漢撰《說文解字》，立五百四十部，為文字訓詁之巨著。%{text_link}主要依字形結構析字，並以正名之說申其理，故其旨兼涉政教，非徒訓詁字義而已。許氏序曰：
      preface_translation_html: '<i>其言以文字為經藝、王政之本，前人藉以傳後，後人藉以識古；本立則道生，故天下至賾亦可條理而不亂。</i>'
      historical_caution_html: 此說深本儒家正名之旨，固有規範之意。然許氏亦未必盡是：其書去今近二千年，近世古文字材料，尤甲骨文，皆非當時所得見。
      comparison: 《說文》部首與康熙部首不同。其以形體相似廣分諸字，或表音，或表義，甚至僅一筆，故本站稱之為「部件」。
      text_itself: 原文
      shuowen_jiezi: 《說文解字》
      page_title: 《說文》部首%{number} %{glyph}
      heading: '《說文》部首%{number}：'
      about: 此部件
      back: 返《說文》部首索引
