    hero:
      daily_reading_aria: 今日《詩經》誦讀
      summary: >-
        歡迎來訪泛亞漢文語料庫。庫中漢文篇幅逾《四庫全書》二倍，所收兼及亞洲諸地與歷代；並備閱文、尋文、治學諸具。
    introduction:
      heading: 序
      body: >-
        泛亞漢文語料庫收中國歷朝、朝鮮半島、日本、越南、琉球國、新加坡，及歷史上諸國諸地之漢文。漢文歷用於諸地諸時，文章百體，所屬社會亦各異。本計畫有三旨：一、如實呈其地域與文化之別；二、助今人教學研習；三、使語料、佐證及治學諸具易於取用。
    corpus_viewer:
      heading: 語料庫閱覽器
      link: 觀
      introduction: 語料庫閱覽器備諸具，以閱覽、研習庫中漢文。
      includes: 其所備者：
      features:
        pronunciation: 備亞洲諸語及方言讀音旁訓，如官話、日語、韓語、越語、壯語、老國音、中古漢語、上古漢語、沖繩語等；可擇合所學者用之。
        punctuation: 可加標點（句讀），亦可盡去之。
        underlining: 備傳統畫線法，或循原定之色，或改用易辨之配色。
        annotation_systems: 備日本、韓國、越南之漢文訓讀註法。
        fonts: 備諸字體，亦有篆書字體。
        orientation: 縱書、橫書皆可，版面隨之調整。
        character_forms: 可轉換諸漢字字形，含簡化字及已廢之簡化方案。
        dictionary: 備合Unihan等資料及本庫考證之字典。
        translations: 可閱譯文，亦可呈譯文。
    dictionary:
      heading: 字典
      overview: 本站字典合釋義、讀音、標音、異體及字形轉換於一處。其資料兼取既有字典、Unihan及本庫所作之異體考證。
      sources: 字典釋義及彈窗取資CC-CEDICT、Unihan及《康熙字典》。《康熙字典》條目重新分行，以便閱覽。《廣韻》與《說文解字》亦可於本站瀏覽，其排序法見各頁說明。
      planned_intro: '後將續收歷代字典，以資比勘，包括《四庫全書》所引諸書：'
      wider_scope: 亦擬收中國以外諸國字典，以助漢文學習及研究，兼顧其廣布諸地之書寫傳統。
    submission:
      heading: 呈新文
      introduction: 請擇此文所隸之集。
      open_button: 呈新文
      path_hint_html: 請擇最合此文之語料分類，如%{first_path}或%{second_path}。
      parent_path_placeholder: 如：越南漢文/clean
    future_plans:
      heading: 後圖
      body: 後擬增列國圖譜、語法維基，詳備異本與校正文，並為更多作品撰梗概與提要。
    publications:
