    activity:
      title: 語料近況 Corpus activity
      introduction: This page exposes the corpus activity index so additions and unexpected
        edits are easier to inspect. It reflects the current indexed files and their
        modification times; it is useful for review, but it is not an immutable history
        and cannot show deleted files.
