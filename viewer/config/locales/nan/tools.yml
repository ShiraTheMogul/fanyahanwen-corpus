    lunar:
      title: Lunar calendar date converter
      description_html: The Chinese lunar calendar uses the sexagenary cycle to format dates. This uses %{link} to convert between Gregorian and Chinese calendar dates.
      date_picker: Date picker
      paste_date: Or paste a date
      placeholder: 'Examples: 2026-01-07 | 07/01/2026 | 7 Jan 2026 | today'
      solar: Solar
      lunar: Lunar
      note: Note
      parse_failed: Could not parse a date.
      warnings:
        month_first: Interpreted as MM/DD/YYYY because the middle number exceeds 12.
        ambiguous: Ambiguous numeric date; interpreted as DD/MM/YYYY (UK default).
    numerals:
      title: Numeral converter
      description: A simple mapper for Chinese numerals that accounts for some occasional outliers and variant forms. It is not perfect, but works for most cases. It is also used to produce the more robust lunar-calendar representation shown in the site header.
      placeholder: Paste text containing numbers…
      use_you: Use 有 for gaps
      use_abbreviations: Use 廿/卅/卌
