    phonetic:
      mandarin:
        title: Mandarin phoneticisation
        description_html: Mandarin has an unusually large number of phoneticisation systems, which can be overwhelming. This uses dohliam’s %{link} to convert between thirteen of them.
        placeholder: han4 yu3 ...
      cantonese:
        title: Cantonese phoneticisation
        placeholder: gwong2 dung1 waa2 ...
      original: Original
    character_extractor:
      title: Character data extractor
      description: This preserves the old Cangjie lookup while also allowing other stored character data to be extracted in bulk. Paste one character, a codepoint such as U+8BF4, or a complete sentence to produce one row for each unique Han character.
      flashcard_help: 'This can enrich flashcards: definitions, dictionary entries, and readings can be previewed on the page or downloaded as CSV.'
      input_placeholder: 'Character (for example 說), U+8BF4, or Cangjie letters (for example ABC)

        Or paste a sentence to extract every unique character.'
      show_hkcards: Show the HKCards table for Cangjie
      options:
        cangjie: Cangjie input
        unicode_definition: Unicode definition (Unihan)
        kangxi_entry: Kangxi dictionary entry
        shuowen_entry: Shuowen entry
        guangyun_definition: Guangyun definition
        guangyun_fanqie: Guangyun fanqie
        guangyun_rhyme: Guangyun rhyme
        guangyun_tone: Guangyun tone
