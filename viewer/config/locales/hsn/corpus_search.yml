      title: Prepared Corpus Search
      status: Status
      query: Query
      progress: 'Stage: %{stage}. Files: %{scanned} / %{total}. Hits found: %{hits}.'
      zip_contents: The ZIP contains results.csv, flashcards.csv, and metadata.json.
      refresh_notice: This page will refresh every %{seconds} seconds while the job is running.
    statuses:
      queued: Queued
      running: Running
      complete: Complete
      failed: Failed
    stages:
      queued: Queued
      searching: Searching
      complete: Complete
      failed: Failed
    notices:
      queued: The large search has been queued. You can keep using the site while it runs.
    errors:
      enter_sequence: Enter an exact sequence to search for.
      enter_two_terms: Enter at least two terms for a proximity search.
      term_too_long: Search terms cannot be longer than %{max} characters.
      search_failed: 'Search failed: %{message}'
      prepared_not_found: Prepared search not found
      download_not_ready: Download is not ready yet
      too_many_terms: A proximity search can contain at most %{max} terms.
      folder_tree_unavailable: The folder list is not ready yet. Searches still cover every folder in the selected text layers.
