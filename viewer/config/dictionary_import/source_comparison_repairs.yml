notes:
  - The corpus Wikisource scrape remains the captured source text.
  - A comparison witness may restore a demonstrably missing reading.
  - Every restoration is guarded by the exact dictionary, document, line, fanqie, and payload SHA-256.
  - Approved restorations are applied to corpus TXT only after an exact dry-run plan.
  - The repair plan, comparison evidence, and backups stay in the process output under tmp/.
  - metadata.json is not changed by this workflow.
matching_guards:
  - dictionary_title
  - document_id
  - source_line_start
  - fanqie
  - payload_sha256
