# Initial dry-run parser policy. These are deliberately conservative.
# A work may be listed here and still be rejected by structural validation.
work_settings:
  廣韻:
    parser: rime_dictionary
    status: reference_import
  重修廣韻:
    parser: rime_dictionary
    status: candidate_import
  集韻:
    parser: rime_dictionary
    status: candidate_import
  五音集韻:
    parser: rime_dictionary
    status: candidate_import
  洪武正韻:
    parser: hongwu_rime_dictionary
    status: candidate_import
  玉篇:
    parser: probe_only
    status: repair_and_review
  釋名:
    parser: probe_only
    status: needs_semantic_segmenter
  爾雅注疏:
    parser: probe_only
    status: needs_layered_commentary_parser
  切韵指掌圖:
    parser: probe_only
    status: needs_table_source
  古音表:
    parser: probe_only
    status: incomplete_source
