version: 1
policy: exact_same_work_comparison_repairs
work: 五音集韻
base_source: Fanya Hanwen Corpus Wikisource scrape
comparison_witness: Chinese Text Project, 《欽定四庫全書》本《五音集韻》
notes:
  - These are exact, localized repairs to demonstrably damaged transcription spans.
  - The comparison witness is the same work and edition family, but remains a comparison witness rather than a replacement source.
  - metadata.json is never changed.
  - Parser-only fixes are not represented as textual repairs.
repairs:
