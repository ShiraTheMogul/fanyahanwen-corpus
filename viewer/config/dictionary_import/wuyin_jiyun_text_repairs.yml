    document_id: 206178
    source_line: 1970
    original_line: "〈亦古文□石也釋名散也言列位布散也今増〉○"
    replacement_line: "〈亦古文□石也釋名散也言列位布散也今増〉〇"
    witness_url: https://ctext.org/wiki.pl?chapter=997684&if=gb
    witness_reading: "今増〇唐武后作星字"
