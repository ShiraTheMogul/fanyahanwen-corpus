# Fanya Hanwen Corpus known compilation / collection map.
#
# This is deliberately explicit and reviewable. It does not move corpus files.
# The map is used only to identify folders that should emit is_compilation: true
# and a conservative worklist. It does not add unstable taxonomy/status metadata.
version: 1

known_compilations:
  - title: 詩經
    extractable_items: true
    match:
      folder_name:
        - 詩經
        - 毛詩

