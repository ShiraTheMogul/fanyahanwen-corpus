# Fanya Hanwen Corpus legacy geography/period mapping seed.
#
# This file is intentionally reviewable. It is not the final JSON schema and it
# does not edit corpus files. It converts old header values, especially old
# NATION/TIMES/REGION values, into suggested JSON-sidecar fields.
#
# Field meanings:
#   corpus_root  = current top-level corpus bucket/file cabinet, e.g. 中國漢文
#   macro_region = broad cultural/geographic grouping, e.g. 中國, 日本, 朝鮮
#   period       = chronological label, e.g. 唐朝, 北宋, 江戶時代
#   polity       = state/government label where useful, e.g. 唐, 琉球國
#   region       = smaller region/place/province/domain/etc.
#
version: 1
rules:
  dynastic_chao_suffix_is_period: true
  treat_times_values_as_period_by_default: true
  treat_region_values_as_region_by_default: true

corpus_roots:
  中國漢文:
    macro_region: 中國
  日本漢文:
    macro_region: 日本
  朝鮮漢文:
    macro_region: 朝鮮
  韓國漢文:
    macro_region: 朝鮮
  越南漢文:
    macro_region: 越南
  琉球漢文:
    macro_region: 琉球
  新加坡漢文:
    macro_region: 新加坡
  Tibet:
    macro_region: Tibet
  西藏漢文:
    macro_region: Tibet

