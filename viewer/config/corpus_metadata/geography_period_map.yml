  朝鮮典籍:
    corpus_root: 朝鮮漢文
    macro_region: 朝鮮
    polity: 朝鮮
    confidence: medium
    notes: Legacy source/corpus label; fold to 朝鮮 when used as old NATION.
  朝鮮漢詩:
    corpus_root: 朝鮮漢文
    macro_region: 朝鮮
    polity: 朝鮮
    confidence: medium
    notes: Legacy genre/source label; fold to 朝鮮 when used as old NATION.
  日本漢詩:
    corpus_root: 日本漢文
    macro_region: 日本
    confidence: medium
    notes: Legacy genre/source label; do not preserve as polity.

