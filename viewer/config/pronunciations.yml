# Central pronunciation registry.
#
# This file describes hand-maintained pronunciation fields already used by the
# viewer. Large imported collections should be registered separately in
# config/pronunciation_datasets.yml so this file remains readable.
#
# A field may optionally expose a ruby source. The ruby block tells the viewer
# which session key to use, which CharacterProperty sources are valid, and how
# to format the selected token.

