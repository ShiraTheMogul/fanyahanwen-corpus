[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wenyan_syntax"
version = "0.8.0"
description = "Pulleyblank-aligned construction-first syntactic scorer for Literary Chinese"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "fanyahanwen corpus tooling"}]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["wenyan_syntax*"]
